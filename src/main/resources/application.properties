spring.application.name=pure-root

# 日志根目录，服务器上用环境变量 LOGGING_FILE_PATH 覆盖为绝对路径
logging.file.path=logs

# 数据源，服务器上的真实值来自 /workspace/pure-root/env
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pure_root}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:pure_root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mapper xml 位置：当前只用 BaseMapper 内置 CRUD，留此配置供后续自定义 SQL
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
